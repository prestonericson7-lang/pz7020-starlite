<svg viewBox="0 0 880 640" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="t1 d1" font-family="Helvetica, Arial, sans-serif">
<title id="t1">PZ7020-StarLite board, top view, with the fan power holes marked</title>
<desc id="d1">Board 90 by 60 mm, component side up, geometry from the vendor PCB DXF. A 40-pin header runs along the bottom edge and another along the top edge. Two Ethernet jacks on the right edge, two USB-C ports on the left edge, the Zynq chip in the middle. Bottom header: pin 1 (5 V) is the square pad at the right end in the inner row; pin 3 (GND) is the next hole to its left. Top header: pin 1 (5 V) is the square pad at the left end in the inner row; pin 3 (GND) is the next hole to its right. The hole directly across from pin 1 is pin 2 (3.3 V).</desc>
